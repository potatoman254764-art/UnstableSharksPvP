
name: Build UnstableSharksPvP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: UnstableSharksPvP-build-ready/pom.xml

      - name: Build plugin
        working-directory: UnstableSharksPvP-build-ready
        run: mvn -B clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: UnstableSharksPvP-JAR
          path: UnstableSharksPvP-build-ready/target/*.jar
          if-no-files-found: error
